<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Space+Mono:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');

      .font-mono {
        font-family: 'Space Mono', 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
      }
      .font-sans {
        font-family: 'Satoshi', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-serif {
        font-family: 'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif;
      }
      .font-serif-italic {
        font-family: 'Lora', 'Georgia', 'Cambria', serif;
        font-style: italic;
      }
    </style>

    <!-- Deep Carbon & Ambient Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <!-- Ambient Radial Glows (Nodefolio & Nirogshaala atmospheric lighting) -->
    <radialGradient id="tealGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0"/>
    </radialGradient>

    <!-- Refined Accent Gradient -->
    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.04)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)"/>
    </linearGradient>

    <!-- Architectural Grid -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.06)"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="14" fill="url(#archGrid)"/>
  <rect width="1200" height="380" rx="14" fill="url(#tealGlow)"/>
  <rect width="1200" height="380" rx="14" fill="url(#indigoGlow)"/>

  <!-- Precision Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="378" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Architectural Corner Crosshairs (+) inspired by Nodefolio CAD style -->
  <g stroke="rgba(255, 255, 255, 0.25)" stroke-width="1">
    <!-- Top Left -->
    <line x1="24" y1="20" x2="24" y2="30"/>
    <line x1="19" y1="25" x2="29" y2="25"/>
    <!-- Top Right -->
    <line x1="1176" y1="20" x2="1176" y2="30"/>
    <line x1="1171" y1="25" x2="1181" y2="25"/>
    <!-- Bottom Left -->
    <line x1="24" y1="350" x2="24" y2="360"/>
    <line x1="19" y1="355" x2="29" y2="355"/>
    <!-- Bottom Right -->
    <line x1="1176" y1="350" x2="1176" y2="360"/>
    <line x1="1171" y1="355" x2="1181" y2="355"/>
  </g>

  <!-- ================= TOP METADATA BAR ================= -->
  <!-- Top Horizontal Guide Line -->
  <line x1="45" y1="52" x2="1155" y2="52" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Left: System Identity (Monospace) -->
  <text x="50" y="42" class="font-mono" font-size="11" fill="#64748b" letter-spacing="1.5">
    SYS.ID // <tspan fill="#94a3b8">RD-COLLECTIVE</tspan>
  </text>

  <!-- Center: Live Status Indicator -->
  <g transform="translate(525, 30)">
    <rect width="150" height="22" rx="11" fill="rgba(20, 184, 166, 0.08)" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="11" r="3.5" fill="#2dd4bf"/>
    <circle cx="16" cy="11" r="6" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
    <text x="80" y="15" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#2dd4bf" letter-spacing="1">
      ACTIVE LAB
    </text>
  </g>

  <!-- Right: Chrono / Version -->
  <text x="1150" y="42" text-anchor="end" class="font-mono" font-size="11" fill="#64748b" letter-spacing="1.5">
    VER 1.0.4 <tspan fill="#475569">|</tspan> <tspan fill="#94a3b8">OPEN REPO</tspan>
  </text>

  <!-- ================= CENTER HERO SECTION ================= -->
  <!-- Overline Category -->
  <text x="600" y="112" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#2dd4bf" letter-spacing="4">
    COLLABORATIVE SOFTWARE &amp; SYSTEMS RESEARCH
  </text>

  <!-- Main Headline: Typographic Pairing of Modern Bold Display + Editorial Serif Italic -->
  <g text-anchor="middle">
    <text x="600" y="172">
      <!-- RESEARCHMENTS in ultra-clean geometric sans (Satoshi style) -->
      <tspan class="font-sans" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">RESEARCHMENTS </tspan>
      <!-- Ampersand in elegant editorial serif italic (Lora style) -->
      <tspan class="font-serif-italic" font-size="44" font-weight="400" fill="#2dd4bf">&amp; </tspan>
      <!-- D. in sharp modern bold display -->
      <tspan class="font-sans" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">D.</tspan>
    </text>
  </g>

  <!-- Refined Hairline Accent Rule -->
  <line x1="380" y1="192" x2="820" y2="192" stroke="url(#accentRule)" stroke-width="1.5"/>
  <circle cx="600" cy="192" r="2.5" fill="#818cf8"/>

  <!-- Subtitle: Editorial Serif & Clean Sans Harmony -->
  <text x="600" y="226" text-anchor="middle" class="font-serif-italic" font-size="16" fill="#cbd5e1" letter-spacing="0.3">
    "A shared creative workshop for computational experiments, systems engineering, and collaborative prototypes."
  </text>

  <!-- ================= BOTTOM ARCHITECTURAL PANELS ================= -->
  <!-- Panel 1: Systems & Computing -->
  <g transform="translate(100, 268)">
    <rect width="310" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <line x1="0" y1="0" x2="310" y2="0" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1"/>
    <text x="18" y="26" class="font-mono" font-size="10" font-weight="700" fill="#2dd4bf" letter-spacing="1.5">
      01 // COMPUTING
    </text>
    <text x="18" y="47" class="font-sans" font-size="12" font-weight="500" fill="#94a3b8">
      Distributed Tools &amp; Full-Stack Apps
    </text>
  </g>

  <!-- Panel 2: Intelligence & Models -->
  <g transform="translate(445, 268)">
    <rect width="310" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <line x1="0" y1="0" x2="310" y2="0" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
    <text x="18" y="26" class="font-mono" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="1.5">
      02 // INTELLIGENCE
    </text>
    <text x="18" y="47" class="font-sans" font-size="12" font-weight="500" fill="#94a3b8">
      AI Architectures &amp; Applied Analysis
    </text>
  </g>

  <!-- Panel 3: Collaborative Open Lab -->
  <g transform="translate(790, 268)">
    <rect width="310" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <line x1="0" y1="0" x2="310" y2="0" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <text x="18" y="26" class="font-mono" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1.5">
      03 // OPEN LAB
    </text>
    <text x="18" y="47" class="font-sans" font-size="12" font-weight="500" fill="#94a3b8">
      Joint Codebases &amp; Research Notes
    </text>
  </g>

  <!-- Bottom Accent Coordinates / Timestamp in Monospace -->
  <text x="600" y="358" text-anchor="middle" class="font-mono" font-size="9" fill="#475569" letter-spacing="2">
    WORKSPACE COORDINATES : 28°38'N 77°13'E // MARKS &amp; COLLABORATORS
  </text>
</svg>
