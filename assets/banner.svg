<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(56, 189, 248, 0.15)"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="280" rx="16" fill="url(#bgGradient)"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)"/>

  <!-- Border Highlight -->
  <rect width="998" height="278" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Decorative Circuit / Node Graphics -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 50 140 H 120 L 140 160 H 190" />
    <circle cx="50" cy="140" r="3" fill="#38bdf8"/>
    <circle cx="190" cy="160" r="3" fill="#818cf8"/>

    <path d="M 810 120 H 860 L 880 140 H 950" />
    <circle cx="810" cy="120" r="3" fill="#818cf8"/>
    <circle cx="950" cy="140" r="3" fill="#c084fc"/>

    <path d="M 850 180 L 870 200 H 930" />
    <circle cx="850" cy="180" r="2.5" fill="#38bdf8"/>
    <circle cx="930" cy="200" r="2.5" fill="#c084fc"/>
  </g>

  <!-- Content Group -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Tag -->
    <rect x="390" y="38" width="220" height="26" rx="13" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="500" y="55" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="2">COLLABORATIVE LAB</text>

    <!-- Main Title -->
    <text x="500" y="118" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="3">RESEARCHMENTS &amp; D</text>
    <rect x="360" y="132" width="280" height="3" rx="1.5" fill="url(#accentGradient)"/>

    <!-- Subtitle -->
    <text x="500" y="168" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="0.5">
      Open Collaborative Workspace for Software Engineering, Applied Research &amp; Prototyping
    </text>

    <!-- Feature Pills -->
    <g transform="translate(230, 202)" font-size="12" font-weight="500" fill="#cbd5e1">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#38bdf8"/>
      <text x="90" y="20" text-anchor="middle">Applied Research</text>

      <!-- Pill 2 -->
      <rect x="190" y="0" width="160" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="210" cy="16" r="4" fill="#818cf8"/>
      <text x="280" y="20" text-anchor="middle">Team Prototypes</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="160" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="400" cy="16" r="4" fill="#c084fc"/>
      <text x="470" y="20" text-anchor="middle">Open Innovation</text>
    </g>
  </g>
</svg>
